name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, tests, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:server
      - run: npm run test:drive
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  ios:
    name: iOS simulator build
    runs-on: macos-latest
    timeout-minutes: 60
    # Non-blocking until it has passed once (plan, foundation "Answers for builders").
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --no-install
      - name: Install pods
        working-directory: ios
        run: pod install
      - name: Build for the simulator
        run: |
          shopt -s nullglob
          workspaces=(ios/*.xcworkspace)
          if [ ${#workspaces[@]} -ne 1 ]; then
            echo "expected one .xcworkspace in ios/ after prebuild, found ${#workspaces[@]}" >&2
            exit 1
          fi
          workspace=${workspaces[0]}
          scheme=$(basename "$workspace" .xcworkspace)
          echo "workspace=$workspace scheme=$scheme"
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
