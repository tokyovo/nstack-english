# Completes everyday A0 u1 on Android, leaves the result for the track list, presses back without
# reopening the finished lesson, restarts the app, and sees the lesson completed.
# Run: MAESTRO_CLI_NO_ANALYTICS=1 npm run drive -- android-test .maestro/lesson.yaml
# Each word card and exercise is answered by steps/answer-step.yaml, whatever its kind and place,
# so the flow does not change when the unit's content does.
appId: app.hocenglish
---
- launchApp:
    clearState: true
- openLink: hocenglish://lesson/everyday-a0-u1
- assertVisible: "Chào hỏi"
- assertNotVisible: "Bạn đã học xong bài này."
- tapOn:
    id: "start"

- repeat:
    while:
      notVisible:
        id: "score"
    times: 80
    commands:
      - runFlow: steps/answer-step.yaml

- assertVisible: "Xong bài học!"
- assertVisible:
    id: "score"

# Leave the result for the track list, then press Android back: the finished lesson stays closed.
- tapOn:
    id: "back-to-track"
- assertVisible:
    id: "unit-everyday-a0-u1"
- back
- assertNotVisible: "Xong bài học!"
- assertNotVisible:
    id: "score"

# Close and open the app again: the lesson stays completed.
- stopApp
- launchApp:
    clearState: false
- openLink: hocenglish://lesson/everyday-a0-u1
- assertVisible: "Bạn đã học xong bài này."
- assertVisible: "Học lại"
